apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/devops01
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Decrypt *.sops.yaml Secrets with the age key in flux-system/sops-age.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
