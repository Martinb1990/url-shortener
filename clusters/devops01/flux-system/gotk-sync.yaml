# Flux watches this repo over SSH with a deploy key (secret flux-system/flux-system).
# The key has write access so image automation can commit tag bumps to main.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/Martinb1990/url-shortener
  ref:
    branch: main
  secretRef:
    name: flux-system
  # Only what the cluster needs: manifests and the Helm chart.
  ignore: |
    /*
    !/clusters/
    !/apps/
    !/infrastructure/
    !/charts/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/devops01
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
