# Prometheus Operator, Prometheus, Alertmanager, Grafana, kube-state-metrics
# and node-exporter, sized for a single 4 GB node.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.0.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # k3s runs controller-manager, scheduler, etcd and kube-proxy inside one
    # process with no separate metrics endpoints; scraping them only produces
    # false "target down" alerts.
    kubeControllerManager: { enabled: false }
    kubeScheduler: { enabled: false }
    kubeEtcd: { enabled: false }
    kubeProxy: { enabled: false }
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false

    prometheusOperator:
      resources:
        requests: { cpu: 20m, memory: 48Mi }
        limits: { memory: 128Mi }

    prometheus:
      prometheusSpec:
        retention: 3d
        retentionSize: 3GB
        scrapeInterval: 30s
        evaluationInterval: 30s
        # Pick up ServiceMonitors/PodMonitors/PrometheusRules from every
        # namespace, not just ones labelled for this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        # ~400 MB at 1h of data; grows with series and retention (3d).
        resources:
          requests: { cpu: 100m, memory: 512Mi }
          limits: { memory: 1536Mi }
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 96Mi }
        # Mounted at /etc/alertmanager/secrets/<name>/; the webhook URL stays
        # out of the Alertmanager config (and out of git, via SOPS).
        secrets: [alertmanager-discord]
      config:
        route:
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: "null"
          routes:
            # Watchdog fires constantly to prove the alert pipeline works;
            # InfoInhibitor only exists to mute "info" alerts.
            - matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
              receiver: "null"
            - matchers: ['severity =~ "warning|critical"']
              receiver: discord
        receivers:
          - name: "null"
          - name: discord
            discord_configs:
              - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                send_resolved: true

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # Dashboards and data sources are provisioned from git, so no PVC needed.
      persistence: { enabled: false }
      # Grafana 13 uses ~250 MB right after start and ~400 MB with the stock
      # dashboards loaded; a 256Mi limit got it OOM-killed in a loop.
      resources:
        requests: { cpu: 50m, memory: 320Mi }
        limits: { memory: 768Mi }
      ingress:
        enabled: true
        ingressClassName: traefik
        # *.localhost resolves to 127.0.0.1 in browsers: reach it through the
        # SSH tunnel at http://grafana.localhost:8080
        hosts: ["grafana.localhost"]
      grafana.ini:
        analytics:
          reporting_enabled: false
          check_for_updates: false
        users:
          allow_sign_up: false
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.monitoring.svc:3100
          access: proxy

    kube-state-metrics:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 96Mi }

    prometheus-node-exporter:
      resources:
        requests: { cpu: 10m, memory: 24Mi }
        limits: { memory: 64Mi }
