name: CI

on:
  push:
    branches: [main]
    # Flux commits image-tag bumps here; rebuilding on those would loop forever.
    # Changes to these paths are still fully checked on their pull requests.
    paths-ignore:
      - "apps/devops01/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs opt in to what they need.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  SEMGREP_IMAGE: semgrep/semgrep:1.179.0
  HELM_VERSION: v4.3.0
  KUBECONFORM_VERSION: v0.8.0
  K3D_VERSION: v5.9.0
  K3D_SHA256: 06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0
  K3S_IMAGE: rancher/k3s:v1.36.5-k3s1
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  # ---------------------------------------------------------------- quality
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep -oE '^ruff==[^ ]+' requirements-dev.txt)"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: >
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80 --junitxml=junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml

  infra:
    name: IaC (OpenTofu + Ansible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - name: tofu fmt
        run: tofu fmt -check -recursive -diff infra/tofu
      - name: tofu validate
        working-directory: infra/tofu
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: infra/requirements.txt
      - name: ansible-lint
        working-directory: infra/ansible
        run: |
          pip install -r ../requirements.txt
          ansible-galaxy collection install -r requirements.yml -p collections
          ansible-playbook site.yml --syntax-check
          ansible-lint

  k8s-manifests:
    name: Kubernetes manifests (Helm + Flux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm + kubeconform
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o helm.tgz
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz.sha256sum" | sed 's/ .*/  helm.tgz/' | sha256sum -c -
          tar xzf helm.tgz --strip-components=1 -C /usr/local/bin linux-amd64/helm
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
      - name: helm lint
        run: helm lint charts/url-shortener --strict --set dbSecret.create.enabled=true --set dbSecret.create.password=ci
      - name: Validate rendered chart
        run: >
          helm template ci charts/url-shortener --set dbSecret.create.enabled=true --set dbSecret.create.password=ci
          | kubeconform -strict -summary -kubernetes-version 1.36.0
      - name: Validate Flux manifests
        run: >
          kubeconform -strict -summary -kubernetes-version 1.36.0
          -ignore-filename-pattern kustomization.yaml -skip Secret,CustomResourceDefinition
          -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          clusters apps
      - name: Secrets in apps/ must be SOPS-encrypted
        run: |
          bad=0
          for f in $(grep -rl '^kind: Secret' apps clusters || true); do
            grep -q '^sops:' "$f" || { echo "::error file=$f::Secret is not SOPS-encrypted"; bad=1; }
          done
          exit $bad

  # --------------------------------------------------------------- security
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - name: gitleaks
        # Run as the runner's UID so git doesn't reject the mount as "dubious ownership".
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          "$GITLEAKS_IMAGE" git /repo --redact --verbose --no-banner

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src
          "$SEMGREP_IMAGE" semgrep scan --metrics=off --error
          --config p/python --config p/dockerfile --config p/javascript
          --sarif-output=semgrep.sarif
      - name: Upload results to GitHub Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  deps-and-config:
    name: Dependencies + Dockerfile (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (report)
        run: >
          docker run --rm -v "$PWD:/src" -v trivy-cache:/root/.cache/trivy
          "$TRIVY_IMAGE" fs --ignorefile /src/.trivyignore.yaml --scanners vuln,misconfig,secret
          --format sarif --output /src/trivy-fs.sarif /src
      - name: Upload results to GitHub Security tab
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy filesystem scan (gate on HIGH/CRITICAL)
        run: >
          docker run --rm -v "$PWD:/src" -v trivy-cache:/root/.cache/trivy
          "$TRIVY_IMAGE" fs --ignorefile /src/.trivyignore.yaml --scanners vuln,misconfig,secret
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

  # ------------------------------------------------------- build & publish
  image:
    name: Build, scan, smoke test, publish
    needs: [lint, test, infra, k8s-manifests, secrets, sast, deps-and-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            # Sortable tag that Flux image automation deploys (see apps/devops01).
            type=raw,value=main-{{date 'YYYYMMDDHHmmss' tz='UTC'}}-{{sha}},enable={{is_default_branch}}

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: url-shortener:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (report)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/out" -v trivy-cache:/root/.cache/trivy
          "$TRIVY_IMAGE" image --format sarif --output /out/trivy-image.sarif url-shortener:local
      - name: Upload results to GitHub Security tab
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy image scan (gate on fixable HIGH/CRITICAL)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache/trivy
          "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          url-shortener:local
      - name: Generate SBOM (CycloneDX)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/out" -v trivy-cache:/root/.cache/trivy
          "$TRIVY_IMAGE" image --format cyclonedx --output /out/sbom.cdx.json url-shortener:local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Smoke test (full compose stack)
        run: |
          cp .env.example .env
          docker compose up -d --no-build
          ./scripts/smoke-test.sh http://localhost:8000
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop compose stack
        run: docker compose down -v

      - name: Install k3d + helm
        run: |
          curl -fsSL -o /usr/local/bin/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  /usr/local/bin/k3d" | sha256sum -c -
          chmod +x /usr/local/bin/k3d
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz --strip-components=1 -C /usr/local/bin linux-amd64/helm
      - name: E2E on Kubernetes (k3d, same k3s version as production)
        run: |
          k3d cluster create e2e --image "$K3S_IMAGE" --agents 0 -p "8080:80@loadbalancer" --wait
          k3d image import url-shortener:local -c e2e
          kubectl create namespace e2e
          kubectl label namespace e2e pod-security.kubernetes.io/enforce=restricted
          # Package the chart the way Flux does (version + git sha build metadata),
          # so the real API server validates what production will receive.
          helm package charts/url-shortener --version "0.1.0+${GITHUB_SHA::12}" -d /tmp/chart
          helm install e2e /tmp/chart/url-shortener-*.tgz -n e2e --wait --timeout 4m \
            --set image.repository=url-shortener --set image.tag=local --set image.pullPolicy=Never \
            --set dbSecret.create.enabled=true --set dbSecret.create.password="$(openssl rand -hex 16)"
          kubectl -n e2e get pods -o wide
          ./scripts/smoke-test.sh http://localhost:8080
      - name: Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl -n e2e get all,pvc,events --sort-by=.lastTimestamp || true
          kubectl -n e2e logs -l app.kubernetes.io/instance=e2e --all-containers --tail=50 || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (reuses build cache)
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Digest: \`${{ steps.push.outputs.digest || 'not pushed (PR build)' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
