- name: Download k3s binary (checksum-verified)
  ansible.builtin.get_url:
    url: "{{ k3s_release_url }}/k3s"
    checksum: "sha256:{{ k3s_release_url }}/sha256sum-amd64.txt"
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
  # A version bump changes the expected checksum, so get_url re-downloads.
  notify: Restart k3s

- name: Link kubectl, crictl and ctr to k3s
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [kubectl, crictl, ctr]

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write k3s config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: Install firewall pre-start script
  ansible.builtin.template:
    src: k3s-firewall.sh.j2
    dest: /usr/local/sbin/k3s-firewall.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart k3s

- name: Install k3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Enable and start k3s
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the node to be Ready
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl wait node --all --for=condition=Ready --timeout=180s
  changed_when: false
  when: not ansible_check_mode

- name: Create .kube directory for {{ k3s_kubeconfig_user }}
  ansible.builtin.file:
    path: "/home/{{ k3s_kubeconfig_user }}/.kube"
    state: directory
    owner: "{{ k3s_kubeconfig_user }}"
    group: "{{ k3s_kubeconfig_user }}"
    mode: "0700"

- name: Copy kubeconfig for {{ k3s_kubeconfig_user }}
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ k3s_kubeconfig_user }}/.kube/config"
    remote_src: true
    owner: "{{ k3s_kubeconfig_user }}"
    group: "{{ k3s_kubeconfig_user }}"
    mode: "0600"
  when: not ansible_check_mode
