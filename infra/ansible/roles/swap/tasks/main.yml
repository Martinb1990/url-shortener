- name: Create swap file
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size_mb }}M {{ swap_file }}"
    creates: "{{ swap_file }}"
  register: swap_created

- name: Restrict swap file permissions
  ansible.builtin.file:
    path: "{{ swap_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Format swap file
  ansible.builtin.command:
    cmd: "mkswap {{ swap_file }}"
  when: swap_created is changed  # noqa: no-handler
  changed_when: true

- name: Check active swap
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: swap_active
  changed_when: false
  check_mode: false

- name: Enable swap file
  ansible.builtin.command:
    cmd: "swapon {{ swap_file }}"
  when: swap_file not in swap_active.stdout_lines
  changed_when: true

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^{{ swap_file }}\s'
    line: "{{ swap_file }} none swap sw 0 0"

- name: Prefer RAM over swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swap_swappiness }}"
    sysctl_file: /etc/sysctl.d/99-swappiness.conf
    reload: true
