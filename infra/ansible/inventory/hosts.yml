all:
  children:
    devops:
      hosts:
        gcp-devops01:
          # The playbook runs on the box itself. To run it from your laptop
          # instead, replace with: ansible_host: <static IP>, ansible_user: <you>
          ansible_connection: local
          # Ubuntu 26.04 defaults to sudo-rs, whose password prompt Ansible
          # can't detect (become times out). Classic sudo ships as sudo.ws.
          ansible_become_exe: sudo.ws
