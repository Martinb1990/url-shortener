apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: url-shortener
  namespace: url-shortener
spec:
  interval: 10m
  releaseName: url-shortener
  chart:
    spec:
      chart: ./charts/url-shortener
      # Rebuild the chart on every git revision (the chart version isn't bumped per change).
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    # A failed upgrade (pods never become ready) is rolled back automatically.
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    ingress:
      host: shortly-martin.duckdns.org
      tls:
        enabled: true
        # Validated with letsencrypt-staging first (issued in ~30s).
        clusterIssuer: letsencrypt-prod
      rateLimit:
        enabled: true
    monitoring:
      serviceMonitor: {enabled: true}
      prometheusRule: {enabled: true}
      dashboard: {enabled: true}
    image:
      # Updated by Flux image automation; don't edit the marker comment.
      tag: main-20261006215931-3abcbd8 # {"$imagepolicy": "flux-system:url-shortener:tag"}
