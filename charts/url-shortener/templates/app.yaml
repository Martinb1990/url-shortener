{{- $name := include "shortener.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "shortener.labels" . | nindent 4 }}
    app.kubernetes.io/name: app
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "shortener.selector" (list . "app") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "shortener.selector" (list . "app") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.dbSecret.name }}, key: postgres-password }
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ $name }}-postgres:5432/{{ .Values.postgres.database }}"
            - name: REDIS_URL
              value: "redis://{{ $name }}-redis:6379/0"
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60   # up to 120s: the app waits for Postgres at startup
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- include "shortener.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "shortener.labels" . | nindent 4 }}
    app.kubernetes.io/name: app
spec:
  selector: {{- include "shortener.selector" (list . "app") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "shortener.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "shortener.selector" (list . "app") | nindent 6 }}
{{- if .Values.ingress.enabled }}
---
# /metrics is for Prometheus, which scrapes the Service directly. Through the
# ingress (i.e. from the internet) it is denied: this exact-path route wins
# over "/" and its allow-list matches no client, so Traefik answers 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-deny
  labels: {{- include "shortener.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange: ["255.255.255.255/32"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}-metrics-deny
  labels: {{- include "shortener.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $name }}-deny@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /metrics
            pathType: Exact
            backend:
              service: { name: {{ $name }}, port: { name: http } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels: {{- include "shortener.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $name }}, port: { name: http } }
{{- end }}
