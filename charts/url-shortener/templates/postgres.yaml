{{- $name := printf "%s-postgres" (include "shortener.fullname" .) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "shortener.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "shortener.selector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "shortener.selector" (list . "postgres") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shortener.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 70     # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.dbSecret.name }}, key: postgres-password }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            periodSeconds: 15
            failureThreshold: 6
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext: {{- include "shortener.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # Postgres 18+ keeps data in a versioned subdirectory of /var/lib/postgresql.
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "shortener.labels" . | nindent 4 }}
spec:
  selector: {{- include "shortener.selector" (list . "postgres") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
