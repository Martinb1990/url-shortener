# -- App ------------------------------------------------------------------
image:
  repository: ghcr.io/martinb1990/url-shortener
  tag: ""            # defaults to the chart appVersion; Flux sets it per deploy
  pullPolicy: IfNotPresent

replicaCount: 2

# Seconds a terminating pod keeps serving (preStop) before it is stopped,
# so in-flight routing can drain during rolling updates.
shutdownDelaySeconds: 5

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { memory: 256Mi }

env:
  CACHE_TTL_SECONDS: "3600"
  CODE_LENGTH: "7"

ingress:
  enabled: true
  className: traefik
  host: ""           # empty = match any host (reach it via the node IP / tunnel)
  tls:
    enabled: false   # needs a real host and cert-manager
    clusterIssuer: letsencrypt-staging
    secretName: url-shortener-tls
    hstsSeconds: 31536000
  # Per-client-IP limits (Traefik rateLimit). Needs the client IP preserved
  # (Traefik service externalTrafficPolicy: Local), else all clients share one.
  rateLimit:
    enabled: false
    average: 20      # requests/s, whole site
    burst: 50
    createAverage: 2 # /api/links (link creation)
    createBurst: 10

# Secret holding the Postgres password (key: postgres-password).
# In the cluster it comes from a SOPS-encrypted manifest; for tests the chart
# can create one from `create.password`.
dbSecret:
  name: url-shortener-db
  create:
    enabled: false
    password: ""

# -- Monitoring (needs the Prometheus Operator CRDs; off by default so the
#    chart installs on a bare cluster, e.g. the CI e2e test) ---------------
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false
  # Grafana dashboard as a ConfigMap, picked up by the Grafana sidecar.
  dashboard:
    enabled: false

# -- PostgreSQL -------------------------------------------------------------
postgres:
  image: postgres:18-alpine
  user: shortener
  database: shortener
  storage: 2Gi
  storageClassName: local-path
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# -- Redis ------------------------------------------------------------------
redis:
  image: redis:8-alpine
  maxmemory: 48mb
  resources:
    requests: { cpu: 20m, memory: 16Mi }
    limits: { memory: 80Mi }
